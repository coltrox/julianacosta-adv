    />

    <script>
      // Marca o documento antes da pintura: evita flash de conteúdo escondido
      // quando o JS está desligado e permite desligar a animação na origem.
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        try {
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            d.classList.add("reduce-motion");
          }
        } catch (e) {}
      })();
    </script>
